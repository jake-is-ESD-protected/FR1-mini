; PlatformIO Project Configuration File

[platformio]
default_envs = FR1-main-release

[common]
platform = espressif32
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    jesdev-io/jescore@^2.3.0
    file://../libFRX
    adafruit/Adafruit SSD1306@^2.5.16
    adafruit/Adafruit GFX Library@^1.12.4
platform_packages =
    platformio/toolchain-xtensa@^2.100300.220621
    tool-esptoolpy@~1.40501.0
src_filter = -<*> +<fsm.cpp> +<fsm_jccl.cpp> +<main.cpp>
base_flags =
    -Isrc
    -Ilib/adc
    -Ilib/ui
    -DFR1_FW_VER_MAJ=1
    -DFR1_FW_VER_MIN=3
    -DFR1_FW_VER_MOD=109
    -DFR1_SER_NUM=2
    -DFR1_DEBUG_PRINT_ENABLE
    -DFSM_INTERNAL_VERBOSE=1
    -DJES_LOG_LEN=16
    -DUNIF_UART_WRITE_BUF_SIZE=128
module_flags =
    -DFRX_ENABLE_MODULE_AUDIO
    -DFRX_ENABLE_MODULE_DSP_FRX
    -DFRX_ENABLE_MODULE_FSM_TOOLS
    -DFRX_ENABLE_MODULE_SDCARD
    -DFRX_ENABLE_MODULE_UTILS
    -DFRX_ENABLE_MODULE_WAV
recorder_audio_flags =
    ; Input-only recorder: libFRX derives bank topology from channel counts.
    -DAUDIO_IO_IN_CH=2
    -DAUDIO_IO_OUT_CH=0
sdcard_spi_flags =
    -DSDCARD_MODE_SPI
release_flags =
    -O3
    -ffast-math

[fr1_hardware]
board = esp-wrover-kit
build_flags =
    ${common.base_flags}
    ${common.module_flags}
    ${common.recorder_audio_flags}
    ${common.sdcard_spi_flags}
    ; FR1-mini audio hardware.
    -DAUDIO_PIN_I2S_BCLK=23
    -DAUDIO_PIN_I2S_WS=4
    -DAUDIO_PIN_I2S_IN_A=27
    ; FR1-mini SD-card hardware: SPI socket.
    -DSDCARD_SPI_PIN_CS=13
    -DSDCARD_SPI_PIN_MOSI=15
    -DSDCARD_SPI_PIN_MISO=2
    -DSDCARD_SPI_PIN_SCK=14
    '-DSDCARD_DEFAULT_FNAME_WAV="fr1_rec_0000.wav"'

[fr0_hardware]
board = az-delivery-devkit-v4
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${common.base_flags}
    ${common.module_flags}
    ${common.recorder_audio_flags}
    ${common.sdcard_spi_flags}
    ; FR0 / ESP32FieldRecorder audio input hardware: BCLK=25, LRCLK/WS=33, DIN=26.
    -DAUDIO_PIN_I2S_BCLK=25
    -DAUDIO_PIN_I2S_WS=33
    -DAUDIO_PIN_I2S_IN_A=26
    ; FR0 SD-card hardware: CS=5, Arduino default ESP32 SPI pins.
    -DSDCARD_SPI_PIN_CS=5
    -DSDCARD_SPI_PIN_MOSI=23
    -DSDCARD_SPI_PIN_MISO=19
    -DSDCARD_SPI_PIN_SCK=18
    '-DSDCARD_DEFAULT_FNAME_WAV="fr0_rec_0000.wav"'
    ; FR0 UI hardware from ESP32FieldRecorder.
    -DUII_BIG_BUTTON_PIN_NUM=35
    -DUII_SMALL_BUTTON_PIN_NUM=34
    -DUIO_LED_PIN=27
    -DUIO_OLED_ROTATION=0
    ; FR0 has no FR1-mini ADC probes. Use dummy inputs.
    -DADC_LIPO_LEVEL_PIN_NUM=36
    -DADC_PLUG_DETECT_PIN_NUM=39

[env:FR1-main-release]
platform = ${common.platform}
framework = ${common.framework}
board = ${fr1_hardware.board}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
platform_packages = ${common.platform_packages}
build_type = release
build_src_filter = ${common.src_filter}
test_build_src = yes
test_filter = none
build_flags =
    ${fr1_hardware.build_flags}
    ${common.release_flags}

[env:FR1-main-debug]
platform = ${common.platform}
framework = ${common.framework}
board = ${fr1_hardware.board}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
platform_packages = ${common.platform_packages}
build_type = debug
debug_speed = 40000
debug_init_break = tbreak setup
debug_tool = esp-prog
debug_build_flags = -O0 -g -ggdb
build_src_filter = ${common.src_filter}
test_build_src = yes
test_filter = none
build_flags = ${fr1_hardware.build_flags}

[env:FR0-legacy-release]
platform = ${common.platform}
framework = ${common.framework}
board = ${fr0_hardware.board}
upload_port = ${fr0_hardware.upload_port}
monitor_port = ${fr0_hardware.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
platform_packages = ${common.platform_packages}
build_type = release
build_src_filter = ${common.src_filter}
test_build_src = yes
test_filter = none
build_flags =
    ${fr0_hardware.build_flags}
    ${common.release_flags}
